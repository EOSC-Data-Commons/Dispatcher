---
- name: Install docker-compose-init.yml
  ansible.builtin.template:
    src: docker-compose-init.yml.j2
    dest: "{{ dispatcher.dir }}/docker-compose-init.yml"
  when: compose_init | default(true) | bool

- name: Install docker-compose.yml
  ansible.builtin.template:
    src: "{{ compose_template | default('docker-compose.yml.j2') }}"
    dest: "{{ dispatcher.dir }}/docker-compose.yml"

- name: Ensure nginx config directory exists
  file:
    path: "{{ dispatcher.dir }}/nginx"
    state: directory
    mode: '0755'

- name: Ensure OCM signing key directory exists
  file:
    path: "{{ dispatcher.dir }}/ocm"
    state: directory
    mode: '0755'

- name: Generate OCM signing key
  ansible.builtin.command:
    cmd: openssl genpkey -algorithm ed25519 -out {{ dispatcher.dir }}/ocm/signing_key.pem
    creates: "{{ dispatcher.dir }}/ocm/signing_key.pem"

# The worker container reads the key as the celery user, like the TLS key (see modify_cert).
- name: Make OCM signing key readable by the containers
  file:
    path: "{{ dispatcher.dir }}/ocm/signing_key.pem"
    mode: '0444'

- name: Install ocm.json
  ansible.builtin.template:
    src: ocm.json.j2
    dest: "{{ dispatcher.dir }}/nginx/ocm.json"

- name: Install nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ dispatcher.dir }}/nginx/nginx.conf"

- name: Install api-config file
  ansible.builtin.template:
    src: config.py.j2
    dest: "{{ dispatcher.dir }}/app/config.py"
  no_log: True
